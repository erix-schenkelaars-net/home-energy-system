services:
  wp_control:
    build: .
    container_name: wp_controller
    restart: unless-stopped
    stop_grace_period: 2s
    network_mode: host
    env_file:
      - ../.env
    environment:
      # Safe default: never publish until this is deliberately set to 0. Overrides ../.env.
      WP_DRY_RUN: "1"          # roomSetpoint control: DRY (not released yet)
      # Outside temperature LIVE (2026-09-10): verified that nothing else publishes to outsideTemp/set
      # (not in automations.yaml/configuration.yaml; the OTThing was on OT slave, now set to MQTT),
      # so wp_control is the only source. roomSetpoint stays dry via WP_DRY_RUN.
      WP_OUTSIDE_DRY_RUN: "0"
      # pi5new CONTROLS the heat pump LIVE (2026-10-23): decides on/off and sends the flow target via
      # chMode1/chSetTemp1. Needs overrideChFlow1=ON on the OTThing. Back to shadow = "0". Live,
      # wp_control also publishes roomSetpoint1 + overrideChOn1/roomMode1 (CH enable, 2026-10-25);
      # WP_DRY_RUN no longer applies then.
      WP_CONTROL_LIVE: "1"
    volumes:
      - .:/app
      - ../common:/app/common:ro
      - ./logs:/logs
