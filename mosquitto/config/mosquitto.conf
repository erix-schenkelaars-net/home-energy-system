# mosquitto.conf — the MQTT broker on pi5new
#
# Replaces the Mosquitto add-on in the Home Assistant VM, so the control path (wp_control, the
# OTThing, zigbee2mqtt) no longer depends on that VM. Same version (2.1.2), same user and password,
# so a client only changes the broker address.

# Plain MQTT on the LAN, like the add-on. The add-on's websockets listener (1884) had no clients.
listener 1883
protocol mqtt

# No anonymous access. The add-on checked logins against HA's users; here a password file holds the
# same mqtt_user. It is git-ignored and generated from .env by mkpasswd.sh.
allow_anonymous false
password_file /mosquitto/config/passwd

# Retained messages (HA discovery configs, last known device states) survive a restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# stdout only; entrypoint.sh tees it into /logs/debug_YYYY-MM-DD.log. Local time, like the database.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# Optional extra config, e.g. the temporary bridge to the old broker during the move. Files in there
# hold credentials and are git-ignored.
include_dir /mosquitto/config/conf.d
