services:
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: phpmyadmin
    restart: unless-stopped
    platform: linux/arm64/v8
    network_mode: host
    environment:
      PMA_HOST: 127.0.0.1
      PMA_PORT: 3306
      PMA_USER:  ${DB_RESOL_USER}
      PMA_PASSWORD: ${DB_RESOL_PASSWORD}
